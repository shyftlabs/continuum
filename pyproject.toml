[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shyftlabs-continuum"
version = "1.2.0"
description = "Agentic Framework for Enterprise-Wide Execution with multi-LLM provider support, observability, and error tracking"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "shyftlabs", email = "continuum@shyftlabs.io"}
]
keywords = [
    "ai",
    "llm",
    "orchestration",
    "agents",
    "langfuse",
    "memory",
    "session",
    "mcp"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "aiohttp>=3.13.2",  # Explicit dependency - latest version fixes enable_cleanup_closed deprecation warning for Python 3.13+
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",  # Explicit dependency — llm/headroom sidecar client (was transitive via SDKs)
    "tiktoken>=0.7.0",
    "langfuse>=2.57.0,<3.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "mem0ai>=1.0.0,<2.0.0",
    "qdrant-client>=1.16.0",
    "pymilvus>=2.4.0",
    "redis>=5.0.0",
    "mcp>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "fakeredis>=2.21.0",
    "respx>=0.21.0",
    "ruff==0.14.10",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
embeddings = [
    "sentence-transformers>=2.2.0",
]
cohere = [
    "cohere>=5.0.0",
]
temporal = [
    "temporalio>=1.23.0",
]
eval = [
    "deepeval>=1.0.0",
    "ragas>=0.2.0",
]
# In-process Headroom compression (headroom_mode=local — no sidecar).
# Upper bound is deliberate: Continuum captures CCR hashes by scanning
# `hash=<24 hex>` markers (llm/headroom/compressor.py), a format contract
# with the library — bump only after re-verifying markers + CompressResult.
# NOTE: headroom-ai pulls litellm transitively (lazy, unused on the
# compression path) — keep this an extra, never a core dependency.
headroom-local = [
    "headroom-ai>=0.28,<0.30",
]
# Optional prose (Kompress) compression for local mode. The base
# [headroom-local] extra covers every transform EXCEPT the ML `text`
# transform — logs (~99%), tables, search, code, diffs, and CCR all run
# on base alone. Kompress needs the ONNX runtime + a tokenizer; this adds
# only those two (the ONNX path — no torch), NOT headroom-ai[proxy] (which
# bundles an unused HTTP server) nor [ml] (torch, ~GBs). First use downloads
# the ~265 MB chopratejas/kompress-v2-base model to the HF cache.
headroom-local-ml = [
    "headroom-ai>=0.28,<0.30",
    "onnxruntime>=1.16.0",
    "transformers>=4.30.0,<6.0",
]

[project.scripts]
continuum = "continuum.cli:main"

[project.urls]
Homepage = "https://github.com/shyftlabs/continuum"
Documentation = "https://github.com/shyftlabs/continuum/tree/main/docs"
Repository = "https://github.com/shyftlabs/continuum"
Issues = "https://github.com/shyftlabs/continuum/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["continuum*"]
exclude = ["tests*", "playground*"]

[tool.setuptools.package-data]
"continuum" = ["py.typed"]
# Bundle the docker-compose stack + Temporal dynamic config so `continuum up`
# works from a pip install without cloning the repo.
"continuum.infra" = ["docker-compose.yml", "temporal/dynamicconfig/*.yaml"]
"*" = []

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["continuum"]

[tool.ruff.lint.per-file-ignores]
# Re-export hubs, plus modules that must configure logging before importing deps.
"__init__.py" = ["F401", "E402"]
# Tests commonly importorskip/guard before imports, use dict() fixtures, and
# deliberately assert on broad exceptions.
"tests/**" = ["E402", "C408", "B017"]
# Playground demos set gateway env vars / sys.path before importing continuum.
"playground/**" = ["E402"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
packages = ["src/continuum"]

[[tool.mypy.overrides]]
# Optional dependency of the [headroom-local] extra (llm/headroom/local_client.py);
# not installed in the default dev environment.
module = "headroom.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require running services)",
    "e2e: End-to-end tests (require all services)",
    "slow: Tests that take more than 5 seconds",
    "live_mcp: Integration tests that require a live MCP server (set MCP_SERVER_URL)",
    "redis: Tests that require a live Redis instance",
    "milvus: Tests that require a live Milvus instance",
    "temporal: Tests that require a live Temporal cluster",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/continuum"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/playground/*",
]

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "pass",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"
