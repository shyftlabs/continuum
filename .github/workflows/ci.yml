name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests (3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        # Legacy issue-investigation tests (test_issue*.py) are excluded: they
        # require optional extras (temporalio/deepeval) and an outdated asyncio
        # loop pattern. Tracked for rehabilitation; not part of the minimal gate.
        run: pytest tests/unit --ignore-glob='tests/unit/test_issue*.py' -q

  test-lowest:
    name: Tests (3.13, lowest deps)
    # The job above installs the newest version each range allows. This one
    # installs the oldest, so a lower bound in pyproject.toml is a tested
    # promise rather than a guess: tiktoken>=0.7.0 and pymilvus>=2.4.0 could
    # not even be installed on Python 3.13 when this job was added.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (lowest direct dependencies)
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution lowest-direct -e ".[dev]"
      - name: Unit tests
        run: pytest tests/unit --ignore-glob='tests/unit/test_issue*.py' -q
